name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HART_for_all-macOS
          path: dist/HART_for_all-macOS.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv
      - run: bash packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HART_for_all-linux
          path: dist/HART_for_all-x86_64.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - run: packaging\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HART_for_all-windows
          path: dist/HART_for_all.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/HART_for_all-macOS/HART_for_all-macOS.zip
            artifacts/HART_for_all-linux/HART_for_all-x86_64.AppImage
            artifacts/HART_for_all-windows/HART_for_all.exe
